name: Remove Android and Apple files
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Delete Android and Apple files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@://github.com"
          git ls-files | grep -iE "(^|/)(android|ios|macos|osx)(/|_|\.)|(_android|_ios|_osx|_macos|\.mm$)" | xargs -r git rm -f
          git commit -m "Remove Android and Apple platform files" || exit 0
          git push
