name: Import Retro Engines into Subtrees
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Import Upstream Engines
        run: |
          git subtree add --prefix=engines/rmg https://github.com master --squash
          git subtree add --prefix=engines/blastem https://github.com master --squash
          git subtree add --prefix=engines/cannonball https://github.com master --squash
          git rm -f .github/workflows/import-subtrees.yml
          git commit -m "chore: remove one-time subtree import workflow"
          git push
