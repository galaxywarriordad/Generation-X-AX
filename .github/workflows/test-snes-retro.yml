name: SNES Retro UI & Audio Filter Tests

on:
  push:
    branches: [ main ]
    paths:
      - 'CMakeLists.txt'
      - 'src/ui/**'
      - 'src/snes/**'
      - 'tests/snes_retro_smoke_test.cpp'
      - '.github/workflows/test-snes-retro.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'CMakeLists.txt'
      - 'src/ui/**'
      - 'src/snes/**'
      - 'tests/snes_retro_smoke_test.cpp'
      - '.github/workflows/test-snes-retro.yml'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Generation-X-AX
        uses: actions/checkout@v6
        with:
          submodules: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build g++

      - name: Configure and build genx-snes-ax and smoke test
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DAX_BUILD_RMG=OFF \
            -DAX_BUILD_BLASTEM=OFF \
            -DAX_BUILD_CANNONBALL=OFF \
            -DAX_BUILD_EDUKE32=OFF \
            -DAX_BUILD_FRONTIER=OFF \
            -DAX_BUILD_FLYCAST=OFF \
            -DAX_BUILD_HATARI=OFF \
            -DGENX_BUILD_SNES=ON \
            -DAX_FETCH_SDK=OFF \
            -DAX_ENABLE_MPK3_MIDI=OFF
          cmake --build build --target genx-snes-ax -j 4
          g++ -std=c++20 -O2 -Wall -Wextra -Werror \
            -Isrc \
            tests/snes_retro_smoke_test.cpp \
            build/src/snes/libax_genx_snes.a \
            -lpthread \
            -o build/snes_retro_smoke_test

      - name: Run C++20 smoke test
        run: ./build/snes_retro_smoke_test

      - name: Verify CLI flags and filter modes
        run: |
          set -e
          mkdir -p /tmp/genx_snes_ci
          printf 'DUMMY_SNES_ROM' > /tmp/genx_snes_ci/demo.sfc

          cat <<EOF > /tmp/genx_snes_ci/ax_engine.ini
          [snes]
          enabled = true
          engine_backend = "bsnes"
          profile_preset = "stock_cycle_exact"
          audio_filter_mode = "default"
          shm_staging_enabled = false
          dac_lock_path = "/tmp/genx_snes_ci/ax-dac.lock"
          persistent_save_dir = "/tmp/genx_snes_ci/saves"
          EOF

          set +e
          ./build/genx-snes-ax >/dev/null 2>&1
          rc=$?
          set -e
          test "$rc" -eq 2

          for flt in default zsnes_warm crt_nearfield; do
            set +e
            timeout -s TERM 1 ./build/genx-snes-ax \
              --config /tmp/genx_snes_ci/ax_engine.ini \
              --rom /tmp/genx_snes_ci/demo.sfc \
              --filter "$flt" \
              --scanlines 25
            rc=$?
            set -e
            test "$rc" -eq 0 -o "$rc" -eq 124 -o "$rc" -eq 143
          done

          set +e
          timeout -s TERM 1 ./build/genx-snes-ax \
            --config /tmp/genx_snes_ci/ax_engine.ini \
            --rom /tmp/genx_snes_ci/demo.sfc \
            --filter zsnes_warm \
            --no-retro-chrome
          rc=$?
          set -e
          test "$rc" -eq 0 -o "$rc" -eq 124 -o "$rc" -eq 143

          rm -rf /tmp/genx_snes_ci
