[ax.core]
topology = 2:3:1
sdk_version = v1_36_2
dac_lock_file = /run/lock/ax-dac.lock

[ax.domains]
audio_timing_mask = 0x01
vulkan_submission_mask = 0x02
guest_simulation_mask = 0x1C
housekeeping_mask = 0x20

[frontier.midi]
enabled = true
device = hw:CARD=MPKmini3,DEV=0
core_mask = 0x20
ring_capacity = 256
max_events_per_frame = 32
stick_deadzone = 0.06
encoder_step_sensitivity = 1.0
time_compression_guard = true
sustain_shift_cc = 64
