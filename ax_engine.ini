[ax.engine]
profile = generation-x
strict_policy_boundary = true

[ax.topology]
layout = 2:3:1
pin_main_thread = true
realtime_scheduler = fifo
realtime_priority = 75
mmcss_task = Games

[ax.memory]
use_large_pages = true
fastmem_enabled = true

[ax.audio]
sample_rate = 48000
channels = 2
ring_buffer_frames = 1024

[ax.telemetry]
enabled = true
shm_name = /ax_retro_bridge_telemetry
publish_interval_ms = 16

[retro.engines]
rmg_enabled = true
blastem_enabled = true
cannonball_enabled = true
